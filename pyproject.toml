[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-calculator"
version = "0.1.0"
description = "Precise arithmetic MCP server for AI agents - eliminates LLM math errors"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "MCP Calculator Contributors", email = "" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "calculator",
    "ai",
    "llm",
    "arithmetic",
    "precision",
    "decimal",
    "claude",
    "anthropic"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/your-org/mcp-calculator"
Documentation = "https://github.com/your-org/mcp-calculator#readme"
Repository = "https://github.com/your-org/mcp-calculator"
Issues = "https://github.com/your-org/mcp-calculator/issues"

[project.scripts]
mcp-calculator = "mcp_calculator.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_calculator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
