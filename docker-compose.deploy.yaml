# Docker Compose for deployment (uses pre-built image)
# Usage: docker-compose -f docker-compose.deploy.yaml up -d

services:
  mcp-calculator:
    image: mcp-calculator:latest
    container_name: mcp-calculator
    ports:
      - "8080:8080"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8080
      - MCP_LOG_LEVEL=info
      - MCP_SESSION_TIMEOUT=10m
      - MCP_MAX_SESSIONS=1000
      - MCP_RATE_LIMIT=60
      - MCP_RATE_LIMIT_BURST=10
      # API key authentication
      - MCP_API_KEY=mcp-calc-secret-key-2026
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
